name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build UI
        working-directory: ui
        run: npm ci && npm run build
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - name: Rust tests
        run: cargo test
      - name: Linux desktop app builds
        run: cargo check -p qrzero
      - name: Large-log speed check
        run: cargo test --release -p qrzero-core --test perf -- --ignored --nocapture
      - name: End-to-end test
        working-directory: ui
        run: npx playwright install --with-deps chromium && npm run e2e

  windows:
    name: Windows build and installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build UI
        working-directory: ui
        run: npm ci && npm run build
      - name: Rust tests
        run: cargo test
      - name: Build installer
        run: npx --yes @tauri-apps/cli@2.12.1 build
      - uses: actions/upload-artifact@v4
        with:
          name: QRZero-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
