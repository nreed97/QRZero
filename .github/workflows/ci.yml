name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch or PR cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build UI
        working-directory: ui
        run: npm ci && npm run build
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - name: Rust tests
        # Failing tests are also posted as annotations, so they show without the full log.
        run: |
          set +e
          cargo test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -A2 -E "panicked at|^test .* FAILED|^error" test.log | grep -v "^--$" | head -40 | sed 's/^/::error::/'
          fi
          exit "$status"
      - name: Linux desktop app builds
        run: cargo check -p qrzero
      - name: Large-log speed check
        run: cargo test --release -p qrzero-core --test perf -- --ignored --nocapture
      - name: End-to-end test
        working-directory: ui
        run: npx playwright install --with-deps chromium && npm run e2e

  windows:
    name: Windows build and installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build UI
        working-directory: ui
        run: npm ci && npm run build
      - name: Rust tests
        # Failing tests are also posted as annotations, so they show without the full log.
        shell: bash
        run: |
          set +e
          cargo test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -A2 -E "panicked at|^test .* FAILED|^error" test.log | grep -v "^--$" | head -40 | sed 's/^/::error::/'
          fi
          exit "$status"
      - name: Build installer
        run: npx --yes @tauri-apps/cli@2.12.1 build
      - uses: actions/upload-artifact@v4
        with:
          name: QRZero-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    name: macOS (Apple Silicon) build and tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build UI
        working-directory: ui
        run: npm ci && npm run build
      - name: Rust tests
        # Failing tests are also posted as annotations, so they show without the full log.
        run: |
          set +e
          cargo test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -A2 -E "panicked at|^test .* FAILED|^error" test.log | grep -v "^--$" | head -40 | sed 's/^/::error::/'
          fi
          exit "$status"
      - name: Build the app and .dmg
        run: npx --yes @tauri-apps/cli@2.12.1 build --bundles dmg
      - name: Check the app is ad-hoc signed
        # Without a signature that covers the whole bundle, macOS says the downloaded app is "damaged".
        run: |
          # Tauri removes the .app after building the .dmg, so check the copy inside the .dmg.
          dmg=$(ls target/release/bundle/dmg/*.dmg | head -1)
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          codesign --verify --deep --strict --verbose=2 "$mnt/QRZero.app"
          codesign -dv "$mnt/QRZero.app" 2>&1 | grep -E "Signature|Identifier"
          hdiutil detach "$mnt"
      - uses: actions/upload-artifact@v4
        with:
          name: QRZero-macos
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
