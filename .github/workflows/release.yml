name: Release

# Builds the Windows and Linux packages and attaches them to a GitHub Release.
# Runs when a tag is pushed, or by hand from the Actions tab for an existing tag.
on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and attach installers to (e.g. Alpha-Release)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Create the release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create the release if it doesn't exist yet
        run: |
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" --prerelease --generate-notes --verify-tag
          fi

  windows:
    name: Build Windows installers
    needs: release
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Set the version from the tag
        # QRZero-Alpha-v0.12 becomes 0.12.0, so file names and the installer version follow the tag.
        # Windows installers need plain numbers, so any words in the tag are left out.
        shell: bash
        run: |
          v=$(echo "$TAG" | grep -oE '[0-9]+(\.[0-9]+){0,2}' | tail -1)
          IFS=. read -r major minor patch <<< "${v:-0.1.0}"
          v="$major.${minor:-0}.${patch:-0}"
          sed -i "0,/^version = \".*\"/s//version = \"$v\"/" Cargo.toml
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$v\"/" src-tauri/tauri.conf.json
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "Building version $v"
      - name: Build UI
        working-directory: ui
        run: npm ci && npm run build
      - name: Build installers
        run: npx --yes @tauri-apps/cli@2.12.1 build
      - name: Attach to release
        shell: bash
        run: |
          cp target/release/qrzero.exe "QRZero_${VERSION}_portable.exe"
          gh release upload "$TAG" --clobber \
            target/release/bundle/msi/*.msi \
            target/release/bundle/nsis/*.exe \
            "QRZero_${VERSION}_portable.exe"

  linux:
    name: Build Linux packages
    needs: release
    # The oldest supported runner, so the AppImage and server run on older distributions too.
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libssl-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Set the version from the tag
        # QRZero-Alpha-v0.12 becomes 0.12.0, so file names and the installer version follow the tag.
        # Windows installers need plain numbers, so any words in the tag are left out.
        shell: bash
        run: |
          v=$(echo "$TAG" | grep -oE '[0-9]+(\.[0-9]+){0,2}' | tail -1)
          IFS=. read -r major minor patch <<< "${v:-0.1.0}"
          v="$major.${minor:-0}.${patch:-0}"
          sed -i "0,/^version = \".*\"/s//version = \"$v\"/" Cargo.toml
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$v\"/" src-tauri/tauri.conf.json
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "Building version $v"
      - name: Build UI
        working-directory: ui
        run: npm ci && npm run build
      - name: Build packages
        run: npx --yes @tauri-apps/cli@2.12.1 build --bundles deb,rpm,appimage
      - name: Build the headless server
        run: cargo build --release -p qrzero-server
      - name: Attach to release
        run: |
          tar -czf "QRZero-server_${VERSION}_linux-x86_64.tar.gz" -C target/release qrzero-server
          gh release upload "$TAG" --clobber \
            target/release/bundle/deb/*.deb \
            target/release/bundle/rpm/*.rpm \
            target/release/bundle/appimage/*.AppImage \
            "QRZero-server_${VERSION}_linux-x86_64.tar.gz"
