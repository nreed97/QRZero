name: Release

# Builds the Windows installers and attaches them to a GitHub Release.
# Runs when a tag is pushed, or by hand from the Actions tab for an existing tag.
on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and attach installers to (e.g. Alpha-Release)
        required: true

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installers
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build UI
        working-directory: ui
        run: npm ci && npm run build
      - name: Build installers
        run: npx --yes @tauri-apps/cli@2.12.1 build
      - name: Attach to release
        shell: bash
        run: |
          cp target/release/qrzero.exe "QRZero-portable.exe"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --prerelease --generate-notes --verify-tag
          fi
          gh release upload "$TAG" --clobber \
            target/release/bundle/msi/*.msi \
            target/release/bundle/nsis/*.exe \
            QRZero-portable.exe
