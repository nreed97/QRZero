[workspace]
resolver = "2"
members = ["crates/core", "crates/radio", "crates/server", "src-tauri"]
default-members = ["crates/core", "crates/radio", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
